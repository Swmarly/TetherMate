name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and package
        shell: pwsh
        run: ./build.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TetherMate-win-x64
          if-no-files-found: error
          path: |
            dist/TetherMate.exe
            dist/TetherMate-*-win-x64.zip
            dist/SHA256SUMS.txt
